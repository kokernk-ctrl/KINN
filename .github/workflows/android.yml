name: android

# Two pipelines:
#
# 1. `studio-app` — the KINN Studio Android app (0.4.0: Studio NEXT is
#    the default launcher interface; the classic native Studio stays
#    bundled as the fallback): builds the web app (NEXT + classic +
#    kinn.wasm) and bundles it into the APK, builds the arm64 JNI
#    compiler for the classic app, then produces a debug APK (debug-
#    signed) and a release APK (signed with the ANDROID_KEYSTORE_*
#    secrets when they exist, otherwise left unsigned and clearly
#    labeled), verifies signatures with apksigner, checks the APK
#    contents (NEXT bundle, wasm, native lib, launcher activity) and
#    uploads the artifacts.
# 2. `backend-apk` — the 0.3 Android *application backend*: exports a
#    Gradle project from a Kin website with the real CLI, builds it on
#    the runner (SDK preinstalled), verifies the APK signature and
#    uploads the artifact. This is the remote build provider of
#    docs/BACKEND_ANDROID.md; it never needs user credentials.
#
# Secret setup (repository Settings -> Secrets and variables -> Actions):
#   ANDROID_KEYSTORE_BASE64  base64 of the release .keystore/.jks file
#   ANDROID_KEYSTORE_PASSWORD  keystore password
#   ANDROID_KEY_ALIAS          key alias
#   ANDROID_KEY_PASSWORD       key password
# See docs/SECURITY.md for how to generate a keystore. Without these
# secrets the pipeline still produces a debug-signed debug APK and an
# UNSIGNED release APK — never a silently fake identity.

on:
  push:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  build:
    name: "studio-app: build + sign + verify APK (arm64)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # The Android SDK is preinstalled on ubuntu-latest (ANDROID_HOME is
      # already exported with sdkmanager on PATH); we only add the pieces
      # the build needs.
      - name: Install SDK pieces (NDK, platform, build-tools)
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | sort | tail -1)
          echo "sdkmanager at: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install "ndk;27.0.12077973" "platforms;android-34" "build-tools;34.0.0" > /dev/null
          echo "ANDROID_HOME=$ANDROID_HOME" | tee -a "$GITHUB_ENV"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Add the wasm32 target (kinn.wasm for Studio NEXT)
        run: rustup target add wasm32-unknown-unknown

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            compiler/target
            ~/.cargo/registry
            ~/.cargo/git
          key: rust-android-${{ hashFiles('compiler/Cargo.lock') }}

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # Studio NEXT ships inside the APK: the built web bundle
      # (next.html + classic entry + JS/CSS) and the real compiler
      # (kinn.wasm, built from the same kinn-ffi as the CLI).
      - name: Build the Studio web bundle (NEXT + wasm compiler)
        working-directory: studio
        run: |
          npm ci
          npm run build:wasm
          npm run build
          ls -la dist/ dist/assets/
          test -f dist/next.html
          test -f dist/index.html
          test -f dist/kinn.wasm

      - name: Build the native compiler for arm64
        working-directory: compiler
        run: |
          cargo ndk -t arm64-v8a --platform 26 -o ../android/app/src/main/jniLibs build --release -p kinn-android
          # kinn-android statically links kinn-ffi; the extra cdylib copy is redundant.
          rm -f ../android/app/src/main/jniLibs/arm64-v8a/libkinn_ffi.so
          ls -la ../android/app/src/main/jniLibs/arm64-v8a/

      - name: Check signing secrets
        id: secrets
        run: |
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "have=true" >> "$GITHUB_OUTPUT"
          else
            echo "have=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Decode the release keystore
        if: steps.secrets.outputs.have == 'true'
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > "$GITHUB_WORKSPACE/release.keystore"
          ls -la "$GITHUB_WORKSPACE/release.keystore"

      - name: Build APKs (debug + release)
        working-directory: android
        env:
          KINN_STORE_FILE: ${{ steps.secrets.outputs.have == 'true' && format('{0}/release.keystore', github.workspace) || '' }}
          KINN_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KINN_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KINN_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleDebug assembleRelease --no-daemon --stacktrace

      - name: Collect and verify the APKs
        working-directory: android
        run: |
          set -e
          OUT=android-artifacts
          mkdir -p "$OUT"
          DEBUG_APK=$(ls app/build/outputs/apk/debug/*.apk | head -n1)
          cp "$DEBUG_APK" "$OUT/kinn-studio-0.4.0-debug.apk"
          RELEASE_APK=$(ls app/build/outputs/apk/release/*.apk | head -n1)
          # Name by actual signing state.
          if ls app/build/outputs/apk/release/*unsigned*.apk > /dev/null 2>&1; then
            cp "$RELEASE_APK" "$OUT/kinn-studio-0.4.0-release-UNSIGNED.apk"
          else
            cp "$RELEASE_APK" "$OUT/kinn-studio-0.4.0-release.apk"
          fi

          # Content verification: the APK must really contain Studio
          # NEXT (web bundle + wasm compiler), the native compiler for
          # the classic app, and must launch NEXT by default.
          echo "== APK content verification (0.4.0) =="
          unzip -l "$OUT/kinn-studio-0.4.0-debug.apk" > contents.txt
          for REQUIRED in \
            "assets/studio-web/next.html" \
            "assets/studio-web/index.html" \
            "assets/studio-web/kinn.wasm" \
            "assets/studio-web/assets/" \
            "assets/docs/README.md" \
            "lib/arm64-v8a/libkinn_android.so" ; do
            grep -q "$REQUIRED" contents.txt || {
              echo "MISSING IN APK: $REQUIRED"; exit 1; }
            echo "ok: $REQUIRED"
          done
          AAPT="$ANDROID_HOME/build-tools/34.0.0/aapt"
          "$AAPT" dump badging "$OUT/kinn-studio-0.4.0-debug.apk" | grep -E "^package|launchable-activity" \
            | tee badging.txt
          grep -q "launchable-activity: name='dev.kinn.studio.NextActivity'" badging.txt || {
            echo "LAUNCHER IS NOT NextActivity"; exit 1; }
          grep -q "versionName='0.4.0'" badging.txt || {
            echo "VERSION IS NOT 0.4.0"; exit 1; }
          # Offline app: still no permissions.
          if "$AAPT" dump badging "$OUT/kinn-studio-0.4.0-debug.apk" | grep -q uses-permission; then
            echo "UNEXPECTED PERMISSIONS FOUND"; exit 1
          fi
          echo "no permissions requested (verified)"

          APKSIGNER="$ANDROID_HOME/build-tools/34.0.0/apksigner"
          {
            echo "== kinn-studio-0.4.0-debug.apk (debug-signed) =="
            "$APKSIGNER" verify --print-certs "$OUT/kinn-studio-0.4.0-debug.apk" || true
            echo
            if [ -f "$OUT/kinn-studio-0.4.0-release.apk" ]; then
              echo "== kinn-studio-0.4.0-release.apk (release-signed) =="
              "$APKSIGNER" verify --print-certs "$OUT/kinn-studio-0.4.0-release.apk"
            else
              echo "== kinn-studio-0.4.0-release-UNSIGNED.apk =="
              echo "NOT SIGNED: configure the ANDROID_KEYSTORE_* secrets to produce"
              echo "a signed release build (see docs/SECURITY.md)."
            fi
          } > "$OUT/signature-report.txt" 2>&1
          cat "$OUT/signature-report.txt"

          cd "$OUT"
          sha256sum *.apk > SHA256SUMS
          cat SHA256SUMS

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kinn-studio-android
          path: android/android-artifacts/

  backend-apk:
    name: "backend: real APK from the exported Kin project"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install SDK pieces (platform, build-tools)
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | sort | tail -1)
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install "platforms;android-34" "build-tools;34.0.0" > /dev/null
          echo "ANDROID_HOME=$ANDROID_HOME" | tee -a "$GITHUB_ENV"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            compiler/target
            ~/.cargo/registry
            ~/.cargo/git
          key: rust-backend-${{ hashFiles('compiler/Cargo.lock') }}

      - name: Build the CLI
        working-directory: compiler
        run: cargo build --release -p kinn

      # The remote build provider: export the Android project from a
      # Kin website, then complete the Gradle wrapper from the checked-in
      # Studio wrapper (the jar is redistributable; the exported project
      # ships without it — ADR-0021).
      - name: Export the Android project from Kin source
        run: |
          compiler/target/release/kinn build examples/web/site.kin --target android --out kinn-android-project
          cp android/gradle/wrapper/gradle-wrapper.jar kinn-android-project/gradle/wrapper/
          cp android/gradlew kinn-android-project/gradlew
          cp android/gradlew.bat kinn-android-project/gradlew.bat
          chmod +x kinn-android-project/gradlew
          ls -la kinn-android-project kinn-android-project/gradle/wrapper

      - name: Build a real APK with Gradle
        working-directory: kinn-android-project
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Verify the APK signature and contents
        run: |
          set -e
          APK=$(ls kinn-android-project/app/build/outputs/apk/debug/*.apk | head -n1)
          echo "APK: $APK"
          APKSIGNER="$ANDROID_HOME/build-tools/34.0.0/apksigner"
          "$APKSIGNER" verify --print-certs "$APK"
          # No permissions in the generated app (aapt is in build-tools).
          AAPT="$ANDROID_HOME/build-tools/34.0.0/aapt"
          "$AAPT" dump badging "$APK" | grep -E "uses-permission" && {
            echo "UNEXPECTED PERMISSIONS FOUND"; exit 1;
          } || echo "no permissions requested (verified)"
          "$AAPT" dump badging "$APK" | head -5
          mkdir -p backend-apk-artifacts
          cp "$APK" backend-apk-artifacts/kinn-website-example-0.3.0-debug.apk
          sha256sum backend-apk-artifacts/*.apk > backend-apk-artifacts/SHA256SUMS
          cat backend-apk-artifacts/SHA256SUMS

      - name: Upload the backend APK
        uses: actions/upload-artifact@v4
        with:
          name: kinn-android-backend-apk
          path: backend-apk-artifacts/
