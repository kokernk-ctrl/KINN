name: ci

# Core test matrix: the Rust workspace on all three desktop platforms and
# the Studio web shell with the real wasm compiler backend.
on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  rust-tests:
    name: rust tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            compiler/target
            ~/.cargo/registry
            ~/.cargo/git
          key: rust-${{ runner.os }}-${{ hashFiles('compiler/Cargo.lock') }}

      - name: Test the compiler workspace
        working-directory: compiler
        run: cargo test --workspace

      - name: Build release CLI
        working-directory: compiler
        run: cargo build --release -p kinn

      - name: Smoke-test the CLI on this platform
        shell: bash
        run: |
          BIN=compiler/target/release/kinn
          if [[ "$RUNNER_OS" == "Windows" ]]; then BIN="$BIN.exe"; fi
          "$BIN" version
          "$BIN" run examples/modules/main.kin
          "$BIN" run examples/for_loops.kin > out.txt
          grep -q "sum: 60" out.txt

  studio-tests:
    name: studio tests (with real wasm backend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            compiler/target
            ~/.cargo/registry
            ~/.cargo/git
          key: rust-wasm-${{ hashFiles('compiler/Cargo.lock') }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: studio
        run: npm ci

      - name: Build the wasm compiler backend
        working-directory: studio
        run: npm run build:wasm

      - name: Test Studio (51 tests incl. 10 against the real compiler)
        working-directory: studio
        run: npm test

      - name: Production build
        working-directory: studio
        run: npm run build

      - name: Upload the Studio site
        uses: actions/upload-artifact@v4
        with:
          name: kinn-studio-web
          path: studio/dist/
