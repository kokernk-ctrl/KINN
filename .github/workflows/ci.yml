name: ci

# Core test matrix: the Rust workspace on all three desktop platforms and
# the Studio web shell with the real wasm compiler backend.
on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  # 0.4.0 (A6 hard gate): the shipped kinnrt.js build artifact must stay
  # strictly within the 16 KB mobile budget. The rust-tests job asserts
  # the same invariant from inside the compiler (byte-identity with
  # js_minify(kinnrt.src.js) + size); this job makes the failure loud,
  # early and independent of any test runner.
  kinnrt-size-gate:
    name: kinnrt.js size gate (16 KB budget)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assert kinnrt.js is minified and <= 16384 bytes
        run: |
          F=compiler/crates/kinc/src/backend/kinnrt.js
          SRC=compiler/crates/kinc/src/backend/kinnrt.src.js
          test -f "$F" || { echo "::error::missing $F"; exit 1; }
          test -f "$SRC" || { echo "::error::missing $SRC (readable source)"; exit 1; }
          SIZE=$(wc -c < "$F")
          SRC_SIZE=$(wc -c < "$SRC")
          echo "kinnrt.js: $SIZE bytes; kinnrt.src.js: $SRC_SIZE bytes; budget: 16384"
          if [ "$SIZE" -gt 16384 ]; then
            echo "::error::kinnrt.js is $SIZE bytes (budget 16384). Regenerate with KINNRT_WRITE=1 cargo test -p kinc kinnrt and shrink kinnrt.src.js."
            exit 1
          fi
          if [ "$SIZE" -ge "$SRC_SIZE" ]; then
            echo "::error::kinnrt.js ($SIZE B) is not smaller than kinnrt.src.js ($SRC_SIZE B) — artifact does not look minified."
            exit 1
          fi
          # The artifact must contain no comment blocks or run-newlines.
          if grep -q '/\*' "$F" || [ "$(wc -l < "$F")" -gt 8 ]; then
            echo "::error::kinnrt.js still contains block comments or many lines — not the minified artifact."
            exit 1
          fi

  rust-tests:
    name: rust tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            compiler/target
            ~/.cargo/registry
            ~/.cargo/git
          key: rust-${{ runner.os }}-${{ hashFiles('compiler/Cargo.lock') }}

      - name: Test the compiler workspace
        working-directory: compiler
        run: cargo test --workspace

      - name: Build release CLI
        working-directory: compiler
        run: cargo build --release -p kinn

      - name: Smoke-test the CLI on this platform
        shell: bash
        run: |
          BIN=compiler/target/release/kinn
          if [[ "$RUNNER_OS" == "Windows" ]]; then BIN="$BIN.exe"; fi
          "$BIN" version
          "$BIN" run examples/modules/main.kin
          "$BIN" run examples/for_loops.kin > out.txt
          grep -q "sum: 60" out.txt

      # 0.3.0: smoke-test the actual build targets with the release CLI.
      - name: Smoke-test the build targets (web + android export)
        shell: bash
        run: |
          BIN=compiler/target/release/kinn
          if [[ "$RUNNER_OS" == "Windows" ]]; then BIN="$BIN.exe"; fi
          "$BIN" targets
          "$BIN" build examples/web/site.kin --target web --out web-dist
          test -f web-dist/index.html
          test -f web-dist/about.html
          test -f web-dist/styles.css
          grep -q 'aria-current="page"' web-dist/index.html
          grep -q '<title>Welcome to KINN · MyWebsite</title>' web-dist/index.html
          "$BIN" build examples/web/site.kin --target android --out android-export
          test -f android-export/app/src/main/AndroidManifest.xml
          test -f android-export/app/src/main/java/dev/kinn/site/mywebsite/MainActivity.kt
          ! grep -q uses-permission android-export/app/src/main/AndroidManifest.xml

  backend-build:
    name: build targets (web + android, debug CLI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Test the targets end-to-end with the debug CLI
        working-directory: compiler
        run: |
          cargo build -p kinn
          BIN=target/debug/kinn
          "$BIN" build ../examples/web/site.kin --target web --out /tmp/ci-web-dist
          test -f /tmp/ci-web-dist/index.html
          "$BIN" build ../examples/web/site.kin --target android --out /tmp/ci-android-export
          test -f /tmp/ci-android-export/settings.gradle.kts
      - name: Upload the generated web dist
        uses: actions/upload-artifact@v4
        with:
          name: kinn-example-web-dist
          path: /tmp/ci-web-dist/

  studio-tests:
    name: studio tests (with real wasm backend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            compiler/target
            ~/.cargo/registry
            ~/.cargo/git
          key: rust-wasm-${{ hashFiles('compiler/Cargo.lock') }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: studio
        run: npm ci

      - name: Build the wasm compiler backend
        working-directory: studio
        run: npm run build:wasm

      - name: Test Studio (128 tests incl. 19 against the real compiler and target backends)
        working-directory: studio
        run: npm test

      - name: Production build
        working-directory: studio
        run: npm run build

      - name: Upload the Studio site
        uses: actions/upload-artifact@v4
        with:
          name: kinn-studio-web
          path: studio/dist/
